  <link rel="icon" href="/ai-or-die/favicon.png">
  <script>
    // The Jakarta workshop pages moved into workshop-jakarta/: keep the old links working

      const match = location.pathname.match(/^\/ai-or-die\/(workshops?-jakarta-2026-11(?:-academia|-executive)?)(\/.*)?$/);

        location.replace("/ai-or-die/workshop-jakarta/" + match[1] + (match[2] || "/") + location.search + location.hash);
      }
    })();
  </script>

    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-content: center; padding: 16px; text-align: center; }
